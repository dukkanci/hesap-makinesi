name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-22.04
    timeout-minutes: 50

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip python3-pip autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev automake \
            build-essential ccache \
            libsqlite3-dev libbz2-dev libreadline-dev liblzma-dev

      - name: Install Buildozer & Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython kivy==2.3.0

      - name: Configure buildozer spec
        run: |
          sed -i 's/^#android.api =.*/android.api = 34/' buildozer.spec
          sed -i 's/^#android.ndk =.*/android.ndk = 25c/' buildozer.spec
          sed -i 's/^#android.minapi =.*/android.minapi = 21/' buildozer.spec
          sed -i 's/^#android.sdk =.*/android.sdk = 34/' buildozer.spec
          sed -i 's/^requirements =.*/requirements = python3,kivy==2.3.0/' buildozer.spec

      - name: Debug buildozer spec
        run: |
          cat buildozer.spec

      - name: Accept Android SDK licenses
        run: |
          yes | ${{ runner.temp }}/android-sdk/tools/bin/sdkmanager --sdk_root=${{ runner.temp }}/android-sdk --licenses
        env:
          ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk

      - name: Install required SDK packages
        run: |
          ${{ runner.temp }}/android-sdk/tools/bin/sdkmanager --sdk_root=${{ runner.temp }}/android-sdk "platform-tools" "build-tools;34.0.0" "platforms;android-34"
        env:
          ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk

      - name: Build APK with Buildozer
        run: |
          buildozer -v android debug > buildozer.log 2>&1
        env:
          ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
          ANDROID_NDK_ROOT: ${{ runner.temp }}/android-ndk

      - name: Upload buildozer log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: buildozer.log
          retention-days: 7

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: calculator-apk
          path: bin/*.apk
          retention-days: 30