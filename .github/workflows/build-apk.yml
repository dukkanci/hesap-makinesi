name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-22.04
    timeout-minutes: 70

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip python3-pip autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev automake \
            build-essential ccache \
            libsqlite3-dev libbz2-dev libreadline-dev liblzma-dev \
            wget unzip

      - name: Install Android SDK commandline tools
        run: |
          mkdir -p ${{ runner.temp }}/android-sdk/cmdline-tools
          cd ${{ runner.temp }}/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mv cmdline-tools latest
          echo "${{ runner.temp }}/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "ANDROID_SDK_ROOT=${{ runner.temp }}/android-sdk" >> $GITHUB_ENV

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses

      - name: Install required SDK packages
        run: |
          sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34" "ndk;25.2.9519653"

      - name: Create old-style tools symlink for p4a compatibility
        run: |
          ln -sf cmdline-tools/latest ${{ runner.temp }}/android-sdk/tools

      - name: Symlink pre-installed SDK/NDK to p4a expected locations
        run: |
          mkdir -p /home/runner/.buildozer/android/platform
          ln -sf ${{ runner.temp }}/android-sdk /home/runner/.buildozer/android/platform/android-sdk
          ln -sf ${{ runner.temp }}/android-sdk/ndk/25.2.9519653 /home/runner/.buildozer/android/platform/android-ndk-r25c

      - name: Install Buildozer & Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython kivy==2.3.0

      - name: Configure buildozer spec
        run: |
          sed -i 's/^#android.api =.*/android.api = 34/' buildozer.spec
          sed -i 's/^#android.ndk =.*/android.ndk = 25c/' buildozer.spec
          sed -i 's/^#android.minapi =.*/android.minapi = 21/' buildozer.spec
          sed -i 's/^#android.sdk =.*/android.sdk = 34/' buildozer.spec
          sed -i 's/^requirements =.*/requirements = python3,kivy==2.3.0/' buildozer.spec

      - name: Debug buildozer spec
        run: |
          cat buildozer.spec

      - name: Build APK with Buildozer
        run: |
          buildozer -v android debug > buildozer.log 2>&1
        env:
          ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
          ANDROID_NDK_ROOT: ${{ runner.temp }}/android-sdk/ndk/25.2.9519653

      - name: Upload buildozer log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: buildozer.log
          retention-days: 7

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: calculator-apk
          path: bin/*.apk
          retention-days: 30