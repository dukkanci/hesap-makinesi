name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    env:
      # Pin versions to avoid conflicts with runner's pre-installed tools
      ANDROID_API: "34"
      ANDROID_MIN_API: "21"
      ANDROID_NDK_VERSION: "27.3.13750724"  # Use runner's pre-installed NDK
      ANDROID_BUILD_TOOLS_VERSION: "34.0.0"
      PYTHON_VERSION: "3.11"
      KIVY_VERSION: "2.3.0"
      P4A_VERSION: "2024.08.01"  # Stable python-for-android version

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip python3-pip autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev automake \
            build-essential ccache \
            libsqlite3-dev libbz2-dev libreadline-dev liblzma-dev \
            wget unzip patchelf

      - name: Configure Android SDK (use runner's pre-installed)
        run: |
          # Use runner's pre-installed Android SDK at /usr/local/lib/android/sdk
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/build-tools/${ANDROID_BUILD_TOOLS_VERSION}" >> $GITHUB_PATH

      - name: Verify Android SDK setup
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          sdkmanager --list_installed | grep -E "(platform-tools|build-tools|platforms|ndk)"

      - name: Accept Android SDK licenses (system SDK)
        run: |
          yes | sdkmanager --licenses

      - name: Install required SDK packages (only missing ones)
        run: |
          sdkmanager "platform-tools" "build-tools;${ANDROID_BUILD_TOOLS_VERSION}" "platforms;android-${ANDROID_API}"
          # NDK is pre-installed at ANDROID_NDK_HOME, don't reinstall

      - name: Accept licenses for p4a SDK path (same as system SDK)
        run: |
          # p4a uses ANDROID_SDK_ROOT, ensure licenses accepted there too
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses

      - name: Create p4a NDK symlink (SDK symlink NOT needed)
        run: |
          # p4a expects legacy NDK path - create only NDK symlink
          # SDK is used directly via ANDROID_SDK_ROOT env var
          mkdir -p /home/runner/.buildozer/android/platform
          ln -sf "$ANDROID_NDK_HOME" /home/runner/.buildozer/android/platform/android-ndk-r${ANDROID_NDK_VERSION%%.*}
          # Also create tools symlink for old p4a
          ln -sf "$ANDROID_SDK_ROOT/cmdline-tools/latest" "$ANDROID_SDK_ROOT/tools"

      - name: Install Buildozer, Cython, and pinned p4a
        run: |
          pip install --upgrade pip
          pip install "buildozer==1.5.0" "cython==3.0.11" "kivy==${KIVY_VERSION}"
          # Pin python-for-android to stable version
          pip install "python-for-android==${P4A_VERSION}"

      - name: Debug buildozer spec
        run: |
          cat buildozer.spec

      - name: Build APK with Buildozer
        run: |
          buildozer -v android debug > buildozer.log 2>&1
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_HOME }}
          ANDROIDAPI: ${{ env.ANDROID_API }}
          ANDROIDMINAPI: ${{ env.ANDROID_MIN_API }}

      - name: Upload buildozer log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: buildozer.log
          retention-days: 7

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: calculator-apk
          path: bin/*.apk
          retention-days: 30