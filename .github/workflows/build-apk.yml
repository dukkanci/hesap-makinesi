name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-22.04
    timeout-minutes: 40

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip python3-pip autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev automake \
            build-essential ccache

      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython

      - name: Configure buildozer spec
        run: |
          sed -i 's/^#android.api =.*/android.api = 34/' buildozer.spec
          sed -i 's/^#android.ndk =.*/android.ndk = 25c/' buildozer.spec
          sed -i 's/^#android.minapi =.*/android.minapi = 21/' buildozer.spec
          sed -i 's/^#android.sdk =.*/android.sdk = 34/' buildozer.spec

      - name: Build APK with Buildozer
        run: |
          buildozer -v android debug
        env:
          ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
          ANDROID_NDK_ROOT: ${{ runner.temp }}/android-ndk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: calculator-apk
          path: bin/*.apk
          retention-days: 30